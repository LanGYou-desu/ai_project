<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETIME 网络时光机 · 旧互联网考古</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/eras.css">
</head>
<body>

<header id="topbar">
  <div class="brand">📡 NETIME <span>网络时光机 · 旧互联网考古</span></div>
  <div class="topbtns">
    <button id="btnHelp">❓ 帮助</button>
    <button id="btnSave">💾 保存</button>
    <button id="btnReset">♻ 重置</button>
  </div>
</header>

<main id="layout">
  <!-- 左栏 -->
  <aside id="left">
    <section class="panel">
      <h2>🕰️ 年代时间线</h2>
      <div id="eraNav" class="timeline"></div>
      <div id="keyProgress" title="时间密钥进度"></div>
    </section>
    <section class="panel clue-panel" style="flex:1">
      <h2>📌 案件档案 <span class="cnt" id="clueCount">0</span></h2>
      <div id="clueList" class="scrollable"></div>
    </section>
  </aside>

  <!-- 中栏：浏览器 -->
  <section id="center">
    <div id="browser" class="browser era-1995">
      <div class="browser-titlebar">
        <span class="win-brand" id="browserBrand">Netscape Navigator 3.0</span>
        <span id="pageTitle">NETIME</span>
        <span class="win-btns">
          <span class="win-btn" data-act="min" title="最小化">─</span>
          <span class="win-btn" data-act="max" title="最大化">□</span>
          <span class="win-btn close" data-act="close" title="关闭">✕</span>
        </span>
      </div>
      <div id="tabStrip" class="tabstrip">
        <span class="tb-tab active"><span id="tabTitle">NETIME</span><span class="tb-x" data-act="close" title="关闭标签页">✕</span></span>
      </div>
      <div class="toolbar">
        <button id="btnBack" disabled title="后退">←</button>
        <button id="btnFwd" disabled title="前进">→</button>
        <button id="btnHome" title="回到本年代首页">⌂</button>
        <button id="btnSource" title="查看当前页面的 HTML 源代码">📄 查看源代码</button>
        <input id="urlBar" type="text" spellcheck="false" placeholder="输入网址，回车前往">
        <button id="btnGo">前往</button>
        <input id="searchBox" type="text" placeholder="搜索本年代…">
        <button id="btnSearch">🔍 搜索</button>
      </div>
      <div id="page" class="page page-1995"></div>
      <div id="statusBar">就绪</div>
    </div>

    <div id="loadingOverlay" class="hidden">
      <div class="loading-box">
        <div class="dlg-title">🔌 拨号连接</div>
        <div id="loadingText" class="dlg-body"></div>
        <div class="dlg-progress"><div class="dlg-bar"></div></div>
        <div class="dlg-foot"><button id="loadingSkip" type="button">跳过 (S)</button></div>
      </div>
    </div>

    <div id="viewSourceOverlay" class="hidden">
      <div class="source-box">
        <div class="source-head"><span id="sourceTitle">view-source:</span><button id="sourceClose">✕ 关闭</button></div>
        <pre id="sourceCode"></pre>
      </div>
    </div>
  </section>

  <!-- 右栏 -->
  <aside id="right">
    <section class="panel key-panel">
      <h2>🔑 时间密钥</h2>
      <div id="keyHint" class="dim"></div>
      <div class="key-row">
        <input id="keyInput" type="text" maxlength="8" placeholder="密钥 / 口令" autocomplete="off">
        <button id="btnKey" class="primary">验证</button>
      </div>
    </section>
    <section class="panel tab-panel">
      <div class="tabs">
        <button class="tab active" data-tab="tools">🧰 工具箱</button>
        <button class="tab" data-tab="hint">💡 提示</button>
        <button class="tab" data-tab="notes">📝 笔记</button>
        <button class="tab" data-tab="ach">🏆 成就<span id="achBadge"></span></button>
      </div>
      <div class="tab-body">
        <div id="tab-tools" class="tab-pane active">
          <select id="toolSelect"></select>
          <textarea id="toolInput" placeholder="把要解码的内容粘贴到这里…"></textarea>
          <button id="btnDecode" class="primary">解 码</button>
          <pre id="toolOutput" class="output"></pre>
        </div>
        <div id="tab-hint" class="tab-pane">
          <button id="btnHint">看一条提示</button>
          <div id="hintText" class="dim"></div>
        </div>
        <div id="tab-notes" class="tab-pane">
          <textarea id="notesInput" placeholder="记录你的发现…"></textarea>
          <button id="btnNote">保存笔记</button>
          <div id="noteList" class="scrollable"></div>
        </div>
        <div id="tab-ach" class="tab-pane">
          <div id="achList" class="scrollable"></div>
        </div>
      </div>
    </section>
  </aside>
</main>

<!-- 开场白 -->
<div id="introModal" class="modal hidden">
  <div class="modal-box">
    <div id="introBody"></div>
    <div style="text-align:center">
      <button id="introStart" class="primary big">🚀 启动时光机</button>
    </div>
  </div>
</div>

<!-- 帮助 -->
<div id="helpModal" class="modal hidden">
  <div class="modal-box">
    <div id="helpBody"></div>
    <div style="text-align:center">
      <button id="helpClose" class="primary big">关 闭</button>
    </div>
  </div>
</div>

<div id="toastWrap"></div>

<script src="js/tools.js"></script>
<script src="js/story.js"></script>
<script src="js/sites.js"></script>
<script src="js/engine.js"></script>
<script src="js/puzzle.js"></script>
<script src="js/app.js"></script>
</body>
</html>
