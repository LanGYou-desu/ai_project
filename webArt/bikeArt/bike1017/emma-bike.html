<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>艾玛骑车 · SVG</title>
<style>
  :root { --ink: #2a1f3d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 30px 18px;
    background: radial-gradient(1200px 700px at 50% -12%, #fdf9fb 0%, #f0e6f0 48%, #ded2e4 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
  }
  .stage { width: min(960px, 100%); }
  .card {
    border-radius: 26px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 30px 60px -28px rgba(42, 31, 61, .55);
  }
  svg { display: block; width: 100%; height: auto; }
  .caption {
    margin: 16px 0 0;
    text-align: center;
    font-size: 13px;
    letter-spacing: .1em;
    color: #8b7f9c;
  }
  .caption b { color: #e2557f; font-weight: 600; }
  .caption a { color: #8b7f9c; text-decoration: none; border-bottom: 1px dashed #c6b8d4; }
  .caption a:hover { color: #e2557f; border-bottom-color: #e2557f; }

  @keyframes chainRun { to { stroke-dashoffset: -30; } }
  .chain { stroke-dasharray: 8 7; animation: chainRun .45s linear infinite; }

  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  .spark { animation: twinkle 2.8s ease-in-out infinite; }
  .spark:nth-of-type(2n) { animation-duration: 3.6s; animation-delay: -.9s; }
  .spark:nth-of-type(3n) { animation-duration: 2.2s; animation-delay: -1.5s; }

  @keyframes drift {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    12%  { opacity: .95; }
    80%  { opacity: .85; }
    100% { transform: translate(-150px, 130px) rotate(300deg); opacity: 0; }
  }
  .petal {
    animation: drift 7s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .petal.slow { animation-duration: 10s; }
  .petal.fast { animation-duration: 5.2s; }

  @media (prefers-reduced-motion: reduce) {
    .chain, .spark, .petal { animation: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <svg id="scene" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sceneTitle">
      <title id="sceneTitle">樱羽艾玛骑着自行车穿过夜色，樱花与魔法阵环绕</title>

      <defs>
        <clipPath id="sceneClip"><rect width="1000" height="760" /></clipPath>

        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">

          <stop offset=".38" stop-color="#432a5c" />
          <stop offset=".68" stop-color="#8c4a7c" />
          <stop offset=".88" stop-color="#e08aa6" />
          <stop offset="1" stop-color="#f7b6c4" />
        </linearGradient>
        <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fff2f8" stop-opacity=".9" />
          <stop offset=".42" stop-color="#ffd7e9" stop-opacity=".3" />
          <stop offset="1" stop-color="#ffd7e9" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a2454" />
          <stop offset="1" stop-color="#1e1330" />
        </linearGradient>
        <linearGradient id="hairGrad" x1=".35" y1="0" x2=".65" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset=".5" stop-color="#fbf6fb" />
          <stop offset=".74" stop-color="#ffdcea" />
          <stop offset=".9" stop-color="#ffb2cf" />
          <stop offset="1" stop-color="#ff8fba" />
        </linearGradient>
        <linearGradient id="skinGrad" x1=".25" y1="0" x2=".8" y2="1">
          <stop offset="0" stop-color="#fff1ea" />
          <stop offset="1" stop-color="#ffd6c6" />
        </linearGradient>
        <linearGradient id="coatGrad" x1=".1" y1="0" x2=".9" y2="1">
          <stop offset="0" stop-color="#332a44" />
          <stop offset=".55" stop-color="#221b30" />
          <stop offset="1" stop-color="#120d1b" />
        </linearGradient>
        <linearGradient id="blouseGrad" x1=".2" y1="0" x2=".9" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset=".6" stop-color="#f0f3fc" />
          <stop offset="1" stop-color="#d9e0f2" />
        </linearGradient>
        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="1" stop-color="#ebdcec" />

          <stop offset="1" stop-color="#c9d4ee" />

          <stop offset="1" stop-color="#ffb3d6" stop-opacity="0" />
        </radialGradient>
        <filter id="soft" x="-40%" y="-120%" width="180%" height="340%">

        <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">

            <ellipse cx="4.1" cy="5.7" rx="4.6" ry="6.4" transform="rotate(144 4.1 5.7)" />
            <ellipse cx="-4.1" cy="5.7" rx="4.6" ry="6.4" transform="rotate(216 -4.1 5.7)" />
            <ellipse cx="-6.7" cy="-2.2" rx="4.6" ry="6.4" transform="rotate(288 -6.7 -2.2)" />
          </g>
          <circle r="2.4" fill="#ff9dbe" />
          <g stroke="#ff9dbe" stroke-width=".9" opacity=".8">
            <path d="M0 0v-5" /><path d="M0 0l4.6-2" /><path d="M0 0l-4.6-2" />

        <!-- ================= 地面魔法阵 ================= -->
        <g opacity=".95">

          <g transform="translate(548 652) scale(1 .215)">
            <g>

            <animateTransform attributeName="transform" type="rotate" from="0 330 530" to="360 330 530" dur=".72s" repeatCount="indefinite" />
            <path d="M330 438V622M238 530H422M265 465L395 595M395 465L265 595M245 495L415 565M415 495L245 565"
                  stroke="#bfaad9" stroke-width="3.8" fill="none" stroke-linecap="round" />
            <circle cx="330" cy="530" r="13" fill="#fdf6fb" stroke="#c58fae" stroke-width="4" />

        </g>
        <g id="wheel-front">

          <circle cx="760" cy="530" r="99" fill="none" stroke="#ffc2da" stroke-width="5" />
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 760 530" to="360 760 530" dur=".72s" repeatCount="indefinite" />

                  stroke="#bfaad9" stroke-width="3.8" fill="none" stroke-linecap="round" />
            <circle cx="760" cy="530" r="13" fill="#fdf6fb" stroke="#c58fae" stroke-width="4" />
          </g>
        </g>

        <!-- ================= 车架 ================= -->
        <g id="frame" fill="none" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
          <path d="M330 530L560 540L470 380Z" />
          <path d="M470 380H700L726 452L560 540" />
          <path d="M726 452L760 530" />
        </g>
        <g fill="#ff7aa8">
          <circle cx="330" cy="530" r="7" />
          <circle cx="760" cy="530" r="7" />
          <circle cx="470" cy="380" r="6" />

        <g class="chain" stroke="#c9b6e2" stroke-width="4.5" fill="none">
          <path d="M560 507H330" />
          <path d="M560 573L330 546" />

        <!-- ================= 车座与车把 ================= -->

              fill="#241a30" stroke="#120b1c" stroke-width="3" stroke-linejoin="round" />

        <!-- 车头灯 -->
        <g>
          <circle cx="716" cy="424" r="26" fill="url(#starGlow)" />

              <path d="M-14-6c-2-12 22-17 33-8" fill="none" stroke="#e8e2f2" stroke-width="4" stroke-linecap="round" />

        <!-- ================= 近侧腿 ================= -->

            <path d="M378 404c18-2 42-16 64-38 22-22 40-48 52-70" fill="none" stroke="#f4f7fd" stroke-width="4" stroke-linecap="round" opacity=".9" />
            <path d="M372 414c18 0 40-12 60-33 20-20 36-44 47-64" fill="none" stroke="#f4f7fd" stroke-width="3.4" stroke-linecap="round" opacity=".75" />
            <path d="M512 274C488 294 462 324 444 354c-14 22-22 44-22 58 14-2 34-18 52-42 20-26 32-58 38-96z"
                  fill="#241d31" stroke="#0c0812" stroke-width="3" stroke-linejoin="round" />

          <!-- ---------- 脖子 + 颈圈 ---------- -->
          <path d="M518 206h30v46h-30z" fill="#f0c3b3" />
          <path d="M514 222h38v12h-38z" fill="#1a1523" />
