<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>骑车的鹈鹕 · SVG</title>
<style>
  :root { --ink: #22314a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 30px 18px;
    background: radial-gradient(1100px 620px at 50% -12%, #fdfbf4 0%, #f2ece0 48%, #e5ddcd 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
  }
  .stage { width: min(960px, 100%); }
  .card {
    border-radius: 26px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 30px 60px -28px rgba(34, 49, 74, .5);
  }
  svg { display: block; width: 100%; height: auto; }
  .caption {
    margin: 16px 0 0;
    text-align: center;
    font-size: 13px;
    letter-spacing: .1em;
    color: #8a95a8;
  }
  .caption b { color: #2a9d8f; font-weight: 600; }
  .caption a { color: #8a95a8; text-decoration: none; border-bottom: 1px dashed #c9d3dd; }
  .caption a:hover { color: #2a9d8f; border-bottom-color: #2a9d8f; }

  /* 链条与速度线：CSS 小循环（轮子、脚踏、路面由 SMIL 驱动） */
  @keyframes chainRun { to { stroke-dashoffset: -26; } }
  .chain { stroke-dasharray: 7 6; animation: chainRun .4s linear infinite; }
  @keyframes whoosh { to { stroke-dashoffset: -140; } }
  .speed path { stroke-dasharray: 62 78; animation: whoosh .6s linear infinite; }
  .speed path:nth-child(2) { animation-delay: -.2s; }
  .speed path:nth-child(3) { animation-delay: -.36s; }
  @media (prefers-reduced-motion: reduce) {
    .chain, .speed path { animation: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <svg id="scene" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sceneTitle">
      <title id="sceneTitle">一只系着红围巾的白色鹈鹕，骑着青绿色自行车在乡间小路上飞驰</title>

      <defs>
        <clipPath id="sceneClip"><rect width="900" height="600" /></clipPath>

        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9ed2ef" />
          <stop offset=".42" stop-color="#d6edfb" />
          <stop offset=".76" stop-color="#fdf4de" />
        </linearGradient>
        <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fff6c9" stop-opacity=".95" />
          <stop offset=".55" stop-color="#fff2b8" stop-opacity=".38" />
          <stop offset="1" stop-color="#fff2b8" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f6edda" />
          <stop offset="1" stop-color="#e3d3b4" />
        </linearGradient>
        <linearGradient id="bodyGrad" x1=".15" y1="0" x2=".8" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset=".55" stop-color="#f9f6ef" />
          <stop offset="1" stop-color="#e3dccb" />
        </linearGradient>
        <linearGradient id="beakGrad" x1="0" y1="0" x2=".55" y2="1">
          <stop offset="0" stop-color="#ffd873" />
          <stop offset="1" stop-color="#ee8b1b" />
        </linearGradient>
        <linearGradient id="pouchGrad" x1=".1" y1="0" x2=".4" y2="1">
          <stop offset="0" stop-color="#ffdc98" />
          <stop offset="1" stop-color="#f0a02c" />
        </linearGradient>
        <linearGradient id="wingGrad" x1=".1" y1="0" x2=".7" y2="1">
          <stop offset="0" stop-color="#f4efe2" />
          <stop offset="1" stop-color="#cec4ae" />
        </linearGradient>
        <filter id="soft" x="-40%" y="-120%" width="180%" height="340%">
          <feGaussianBlur stdDeviation="7" />
        </filter>
      </defs>

      <g clip-path="url(#sceneClip)">
        <!-- ===== 天空 ===== -->
        <rect width="900" height="600" fill="url(#skyGrad)" />
        <circle cx="742" cy="116" r="200" fill="url(#sunGlow)" />
        <circle cx="742" cy="116" r="50" fill="#ffeaa9" />

        <!-- 云 -->
        <g id="clouds">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="60s" repeatCount="indefinite" />
          <g id="cloudSet" fill="#ffffff" opacity=".9">
            <g transform="translate(150,104)">
              <ellipse rx="46" ry="23" /><ellipse cx="42" cy="8" rx="31" ry="16" /><ellipse cx="-38" cy="9" rx="27" ry="14" />
            </g>
            <g transform="translate(430,58) scale(.72)">
              <ellipse rx="46" ry="23" /><ellipse cx="40" cy="8" rx="28" ry="15" /><ellipse cx="-36" cy="9" rx="25" ry="13" />
            </g>
            <g transform="translate(690,182) scale(.85)">
              <ellipse rx="46" ry="23" /><ellipse cx="40" cy="8" rx="28" ry="15" /><ellipse cx="-36" cy="9" rx="25" ry="13" />
            </g>
          </g>
          <use href="#cloudSet" x="900" />
        </g>

        <!-- 远处的小鸟 -->
        <g stroke="#6d90ad" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".5">
          <path d="M186 148c8-9 15-9 22 0 7-9 14-9 22 0" />
          <path d="M258 108c6-7 11-7 16 0 5-7 10-7 16 0" />
        </g>

        <!-- ===== 远山与树 ===== -->
        <path d="M-40 468C80 396 196 388 306 438c78 36 150 4 244-14 122-24 250 2 390 44v52H-40z" fill="#a9dec2" />
        <path d="M-40 500c140-40 260-14 380-4 130 10 260-26 380-20 90 4 160 16 220 24v140H-40z" fill="#7ecaa5" />

        <g opacity=".95">
          <g transform="translate(96,472)">
            <rect x="-6" y="-30" width="12" height="34" rx="6" fill="#8d6d51" />
            <circle cx="0" cy="-46" r="27" fill="#63b98f" />
            <circle cx="-22" cy="-34" r="18" fill="#7ed0a6" />
            <circle cx="22" cy="-36" r="16" fill="#7ed0a6" />
          </g>
          <g transform="translate(842,488) scale(.78)">
            <rect x="-6" y="-30" width="12" height="34" rx="6" fill="#8d6d51" />
            <circle cx="0" cy="-46" r="27" fill="#63b98f" />
            <circle cx="-22" cy="-34" r="18" fill="#7ed0a6" />
            <circle cx="22" cy="-36" r="16" fill="#7ed0a6" />
          </g>
        </g>

        <!-- ===== 路面 ===== -->
        <rect y="500" width="900" height="100" fill="url(#roadGrad)" />
        <path d="M0 500h900" stroke="#d6c5a2" stroke-width="5" />
        <g fill="#ffffff" opacity=".85">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur=".6s" repeatCount="indefinite" />
          <rect x="-160" y="542" width="54" height="9" rx="4.5" />
          <rect x="0" y="542" width="54" height="9" rx="4.5" />
          <rect x="160" y="542" width="54" height="9" rx="4.5" />
          <rect x="320" y="542" width="54" height="9" rx="4.5" />
          <rect x="480" y="542" width="54" height="9" rx="4.5" />
          <rect x="640" y="542" width="54" height="9" rx="4.5" />
          <rect x="800" y="542" width="54" height="9" rx="4.5" />
          <rect x="960" y="542" width="54" height="9" rx="4.5" />
          <rect x="1120" y="542" width="54" height="9" rx="4.5" />
        </g>

        <!-- ===== 速度线 ===== -->
        <g class="speed" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".55">
          <path d="M64 300h116" />
          <path d="M26 392h94" />
          <path d="M92 458h116" />
        </g>

        <!-- ===== 影子 ===== -->
        <ellipse cx="464" cy="503" rx="212" ry="12" fill="#6a5a3f" opacity=".22" filter="url(#soft)" />

        <!-- ===== 远侧腿（车架之后） ===== -->
        <line x1="392" y1="268" x2="462" y2="462" stroke="#cf7a1d" stroke-width="9" stroke-linecap="round">
          <animate attributeName="x2" values="462;431;418;431;462;493;506;493;462" dur="1.4s" repeatCount="indefinite" />
          <animate attributeName="y2" values="462;449;418;387;374;387;418;449;462" dur="1.4s" repeatCount="indefinite" />
        </line>

        <!-- ===== 车轮 ===== -->
        <g id="wheel-rear">
          <circle cx="300" cy="412" r="88" fill="none" stroke="#3b4256" stroke-width="13" />
          <circle cx="300" cy="412" r="79" fill="none" stroke="#cfd8e4" stroke-width="5" />
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 300 412" to="360 300 412" dur=".7s" repeatCount="indefinite" />
            <path d="M300 344V480M232 412H368M252 364L348 460M348 364L252 460M274 349L326 475M326 349L274 475"
                  stroke="#c3ccd9" stroke-width="3.6" fill="none" stroke-linecap="round" />
            <circle cx="300" cy="412" r="11" fill="#f7f7f2" stroke="#9aa7b8" stroke-width="4" />
          </g>
        </g>
        <g id="wheel-front">
          <circle cx="628" cy="412" r="88" fill="none" stroke="#3b4256" stroke-width="13" />
          <circle cx="628" cy="412" r="79" fill="none" stroke="#cfd8e4" stroke-width="5" />
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 628 412" to="360 628 412" dur=".7s" repeatCount="indefinite" />
            <path d="M628 344V480M560 412H696M580 364L676 460M676 364L580 460M602 349L654 475M654 349L602 475"
                  stroke="#c3ccd9" stroke-width="3.6" fill="none" stroke-linecap="round" />
            <circle cx="628" cy="412" r="11" fill="#f7f7f2" stroke="#9aa7b8" stroke-width="4" />
          </g>
        </g>

        <!-- ===== 车架 ===== -->
        <g id="frame" fill="none" stroke="#2a9d8f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
          <path d="M300 412L462 418L392 296Z" />
          <path d="M392 296H580L598 352L462 418" />
          <path d="M598 352L628 412" />
        </g>
        <circle cx="300" cy="412" r="6" fill="#1f7f74" />
        <circle cx="628" cy="412" r="6" fill="#1f7f74" />

        <!-- 链条 -->
        <g class="chain" stroke="#9aa7b8" stroke-width="4" fill="none">
          <path d="M462 391H300" />
          <path d="M462 445L300 424" />
        </g>

        <!-- ===== 车座与车把 ===== -->
        <path d="M336 300c8-16 74-20 100-8 10 4 6 16-6 18l-84 2c-12 0-16-6-10-12z"
              fill="#3f4a5f" stroke="#2f394b" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M580 296l-14-28" stroke="#48536a" stroke-width="8" stroke-linecap="round" />
        <path d="M524 266c22-12 66-12 82 2" fill="none" stroke="#3f4a5f" stroke-width="9" stroke-linecap="round" />
        <circle cx="524" cy="266" r="6" fill="#26303f" />
        <circle cx="606" cy="268" r="6" fill="#26303f" />

        <!-- ===== 牙盘 + 脚踏 ===== -->
        <g id="crank">
          <animateTransform attributeName="transform" type="rotate" from="0 462 418" to="360 462 418" dur="1.4s" repeatCount="indefinite" />

          <circle cx="462" cy="418" r="27" fill="none" stroke="#b9c4d2" stroke-width="8" />
          <circle cx="462" cy="418" r="27" fill="none" stroke="#8b98ab" stroke-width="8" stroke-dasharray="3 5" />

          <line x1="462" y1="418" x2="462" y2="374" stroke="#5f6a7d" stroke-width="9" stroke-linecap="round" />
          <line x1="462" y1="418" x2="462" y2="462" stroke="#5f6a7d" stroke-width="9" stroke-linecap="round" />

          <g transform="translate(462,374)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.4s" repeatCount="indefinite" />
              <rect x="-17" y="-5" width="34" height="10" rx="4" fill="#48536a" />
              <path d="M-14-7c0-11 28-11 28 0v3h-28z" fill="#f0952f" stroke="#d97f18" stroke-width="2" stroke-linejoin="round" />
              <path d="M-5-6v-9M5-6v-9" stroke="#d97f18" stroke-width="1.8" opacity=".65" />
            </g>
          </g>
          <g transform="translate(462,462)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.4s" repeatCount="indefinite" />
              <rect x="-17" y="-5" width="34" height="10" rx="4" fill="#3d475a" />
              <path d="M-14-7c0-11 28-11 28 0v3h-28z" fill="#d17b1c" stroke="#b2640f" stroke-width="2" stroke-linejoin="round" />
              <path d="M-5-6v-9M5-6v-9" stroke="#b2640f" stroke-width="1.8" opacity=".65" />
            </g>
          </g>
        </g>

        <!-- ===== 近侧腿 ===== -->
        <line x1="416" y1="276" x2="462" y2="374" stroke="#f0952f" stroke-width="10" stroke-linecap="round">
          <animate attributeName="x2" values="462;493;506;493;462;431;418;431;462" dur="1.4s" repeatCount="indefinite" />
          <animate attributeName="y2" values="374;387;418;449;462;449;418;387;374" dur="1.4s" repeatCount="indefinite" />
        </line>

        <!-- ===== 鹈鹕 ===== -->
        <g id="pelican">
          <animateTransform attributeName="transform" type="rotate"
                            values="-1.1 392 294;1.1 392 294;-1.1 392 294" dur="1.4s" repeatCount="indefinite" />

          <!-- 尾羽 -->
          <path d="M336 262c-24-2-48 10-58 30 18 8 44 8 62-2z"
                fill="#efe9da" stroke="#d5cdba" stroke-width="3" stroke-linejoin="round" />

          <!-- 身体 -->
          <path d="M294 250c-6-50 32-86 94-88 64-2 96 36 92 80-4 46-42 62-92 62s-88-8-94-54z"
                fill="url(#bodyGrad)" stroke="#d8d1c0" stroke-width="3" />

          <!-- 胸腹的羽毛走向 -->
          <g stroke="#e8e1d1" stroke-width="3" fill="none" stroke-linecap="round">
            <path d="M446 246c14 12 18 26 12 38" />
            <path d="M430 268c10 8 12 18 8 26" />
          </g>

          <!-- 围巾飘带 -->
          <g>
            <animateTransform attributeName="transform" type="rotate"
                              values="0 404 160;3.2 404 160;0 404 160" dur="1.1s" repeatCount="indefinite" />
            <path d="M392 150C370 120 334 110 300 120" fill="none" stroke="#e2563f" stroke-width="15" stroke-linecap="round" />
            <path d="M398 162C376 144 346 138 318 142" fill="none" stroke="#f0725b" stroke-width="11" stroke-linecap="round" />
          </g>

          <!-- 脖子 -->
          <path d="M412 188c-16-48 16-90 90-92" fill="none" stroke="url(#bodyGrad)" stroke-width="34" stroke-linecap="round" />

          <!-- 喉囊 -->
          <path d="M538 92c28 76 114 84 176 30z" fill="url(#pouchGrad)" stroke="#d9820f" stroke-width="3" stroke-linejoin="round" />
          <path d="M556 108c34 42 112 44 144 16" fill="none" stroke="#e0942a" stroke-width="3" opacity=".5" />

          <!-- 喙 -->
          <path d="M540 66c76 0 148 22 182 44 8 5 6 17-6 15-62-7-138-19-176-29z"
                fill="url(#beakGrad)" stroke="#d9820f" stroke-width="3" stroke-linejoin="round" />
          <path d="M550 76c70 4 138 22 168 42" fill="none" stroke="#ffe6a8" stroke-width="5" stroke-linecap="round" opacity=".85" />
          <ellipse cx="592" cy="84" rx="9" ry="3.6" fill="#c97610" opacity=".45" transform="rotate(9 592 84)" />

          <!-- 头 -->
          <circle cx="520" cy="88" r="34" fill="url(#bodyGrad)" stroke="#d8d1c0" stroke-width="3" />

          <ellipse cx="506" cy="106" rx="11" ry="6.5" fill="#f7b7a3" opacity=".45" />
          <circle cx="532" cy="76" r="8.5" fill="#2e3440" />
          <circle cx="534.5" cy="73" r="3" fill="#ffffff" />

          <!-- 围巾领结 -->
          <rect x="-23" y="-7" width="46" height="14" rx="7" fill="#e2563f"
                transform="translate(407,158) rotate(5)" />
          <circle cx="399" cy="166" r="7.5" fill="#c8432e" />

          <!-- 翅膀（握住车把） -->
          <path d="M434 182c44 2 74 32 88 64 6 14-4 26-18 20-26-12-54-24-82-32-18-6-30-20-26-32 4-10 16-20 38-20z"
                fill="url(#wingGrad)" stroke="#cfc6b2" stroke-width="3" stroke-linejoin="round" />
          <g stroke="#c8bfaa" stroke-width="3" fill="none" stroke-linecap="round" opacity=".95">
            <path d="M448 196c28 12 52 32 66 56" />
            <path d="M434 214c26 10 50 26 64 46" />
          </g>
          <ellipse cx="522" cy="264" rx="14" ry="10" fill="#efe9da" stroke="#cfc6b2" stroke-width="3" transform="rotate(-14 522 264)" />
        </g>
      </g>
    </svg>
  </div>
  <p class="caption">🏝️ <b>鹈鹕骑士</b> · 整个场景都是 SVG 画的 · <a href="emma-bike.html">去看骑车的小魔女艾玛</a></p>
</div>
</body>
</html>
