<!DOCTYPE html>

<style>

    letter-spacing: .18em;

    text-shadow: 0 0 18px rgba(90, 180, 255, .45);

  .stage {
    width: min(1100px, 96vw);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 26px 60px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .09);
  }
  svg { display: block; width: 100%; height: auto; }
  .hint { margin: 0; font-size: 12px; letter-spacing: .1em; color: #6f8199; }

</head>
<body>

<h1>海边的鹈鹕 · 骑单车</h1>

<div class="stage">
<svg viewBox="0 0 1200 700" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">

  <desc id="d">蓝天、太阳、白云、海浪与沙滩，一只长嘴鹈鹕蹬着红色单车沿海岸前进。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8fd6"/>
      <stop offset=".45" stop-color="#8ed1f2"/>
      <stop offset=".8" stop-color="#d8f0fb"/>
      <stop offset="1" stop-color="#ffeccb"/>

    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c6ba8"/>
      <stop offset=".55" stop-color="#3f9fd0"/>
      <stop offset="1" stop-color="#8ed7ea"/>

    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">

      <stop offset=".55" stop-color="#ffd86b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffd86b" stop-opacity="0"/>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="380" fill="url(#sky)"/>
