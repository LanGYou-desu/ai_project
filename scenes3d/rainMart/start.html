    <title>星降るマート — Rainy Night Diorama</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2307111a'/%3E%3Cpath d='M20 47V28l12-8 12 8v19H20z' fill='%23f7e7bf'/%3E%3Cpath d='M26 47V34h12v13' fill='%23235b57'/%3E%3Cpath d='M15 21l4-4 4 4-4 4z' fill='%23f0c46d'/%3E%3C/svg%3E" />
    <style>
:root {
  color-scheme: dark;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #03070c;
}

body {
  position: relative;
  background:
    radial-gradient(ellipse 70% 58% at 58% 38%, #172b39 0%, #0d1a25 30%, #071019 58%, #03060a 100%);
  cursor: grab;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background:
    radial-gradient(ellipse 62% 52% at 55% 43%, transparent 38%, rgba(1, 4, 8, 0.28) 78%, rgba(1, 3, 6, 0.62) 100%);
}

body.is-dragging {
  cursor: grabbing;
}

#scene {
  display: block;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  outline: none;
  opacity: 0;
  transition: opacity 1.25s ease;
  z-index: 1;
}

#scene.is-ready {
  opacity: 1;
}
