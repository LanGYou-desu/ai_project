<style>

  window.addEventListener('error', function () {
    var overlay = document.getElementById('overlay');
    if (!overlay || overlay.style.display === 'none') return;
    document.getElementById('ovText').textContent = '⚠️ 资源加载失败';
    document.getElementById('ovHint').textContent = '离线模式：请双击项目里的 start.bat 启动本地服务；联网模式：直接双击 index.html（需联网）';
    document.getElementById('ovRetry').hidden = false;
  }, true);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
'use strict';

/* ============================================================
 * 配置与纯逻辑（放在 main() 之外：可读、可测，见 test/run.js）
 * ============================================================ */

// 用 http(s) 打开（start.bat / node server.js）走本地 vendor；
// 直接双击 index.html（file://）走 CDN。vendor 内部全部用相对路径互相 import，
// 不依赖 importmap，所以本地模式真正完全离线。
const LOCAL = location.protocol === 'http:' || location.protocol === 'https:';
const CDN = 'https://cdn.jsdelivr.net/npm/three@0.160.0/';
const LOCAL_GLB = './ferrari.glb';
const GLB_REMOTE = [
  'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/ferrari.glb',
  'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/ferrari.glb',
  'https://threejs.org/examples/models/gltf/ferrari.glb'
];
const LOCAL_DRACO = './vendor/draco/';
const CDN_DRACO = CDN + 'examples/jsm/libs/draco/';

const PAINTS = [
  ['罗索红', '#d40000'], ['竞速黄', '#f7b400'], ['深海蓝', '#16407c'], ['珍珠白', '#e9ebee'],
  ['曜石黑', '#131417'], ['银灰', '#b7bcc3'], ['荧光绿', '#35c94e'], ['落日橙', '#ff6b1a']
];
const RIMS = [['亮银', '#d9dee4'], ['曜黑', '#1a1c20'], ['金色', '#c9a24b']];

const DRIVE_R = 8.5;         // 环形公路半径（米）
const DRIVE_MAX_SPEED = 2.4; // 最高速度
const STEER_MAX = 0.3;       // 前轮最大转向角（弧度）

// 部件名 → 材质键。键到真实材质的映射是 main() 里的 MAT_KEYS。
const SPECIAL_KEYS = {
  body: 'paint', blue: 'accentBlue', yellow_trim: 'accentYellow', glass: 'glass',
  brakes: 'caliper', grills: 'grill', wipers: 'darkPlastic',
  lights: 'headlight', lights_red: 'taillight', leds: 'taillight',
  steering_red_lights: 'taillight', interior_light: 'interiorLight'
};
const CHROME_MESHES = { chrome: 1, metal: 1, steering_metal: 1, nuts: 1, centre: 1 };
const MATERIAL_KEYS = {
  'Body_Color': 'paint', '_0098_DodgerBlue': 'accentBlue', 'Ferrari_Yellow': 'accentYellow',
  'Tires': 'tyre', 'metal_gray': 'metalGray', 'metal_chrome': 'chrome',
  'plastic_gray': 'plasticGray', 'Leather': 'leather', 'Leather_red': 'leatherRed',
  'Interior_dark': 'interiorDark', 'Carpet': 'carpet', 'Carbon_Fiber': 'carbon',
  'Glass_Gray': 'glass', 'Taillight_Glass': 'taillight', 'Projector_Glass': 'projectorGlass',
  'Turn_Signal_LED': 'turn', 'Interior_light': 'interiorLight'
};

// 先按部件名匹配，再按原始材质名兜底；返回 null 表示保持模型自带材质。
function resolveMaterialKey(meshName, materialName) {
  const n = meshName || '';
  let key = SPECIAL_KEYS[n] || null;
  if (n === 'wheel' || /^rim_/.test(n)) key = 'rim';
  else if (/^tire/.test(n)) key = 'tyre';
  else if (n === 'brake') key = 'disc';
  else if (/carbon/.test(n)) key = 'carbon';
  else if (CHROME_MESHES[n]) key = 'chrome';
  if (!key) key = MATERIAL_KEYS[materialName] || null;
  return key;
}

// 加载计划：本地模型 + 本地解码器优先；解码器或模型缺失时再退 CDN。
// 每个元素 { decoder, url }，相邻同 decoder 的尝试复用同一个 DRACOLoader。
function buildLoadAttempts(local) {
  const attempts = [];
  if (local) {
    attempts.push({ decoder: LOCAL_DRACO, url: LOCAL_GLB });
    for (const url of GLB_REMOTE) attempts.push({ decoder: LOCAL_DRACO, url: url });
    for (const url of GLB_REMOTE) attempts.push({ decoder: CDN_DRACO, url: url });
  } else {
    for (const url of GLB_REMOTE) attempts.push({ decoder: CDN_DRACO, url: url });
  }
  return attempts;
}

// 窗口/画布尺寸为 0 或非法时退化成 1×1，避免 camera.aspect = NaN 导致画面全黑。
function viewSize(w, h) {
  return [Math.max(1, Math.floor(w) || 1), Math.max(1, Math.floor(h) || 1)];
}

// 探测 WebGL 是否可用；探测用的上下文立即释放，不占用浏览器上下文配额。
function hasWebGL() {
  try {
    const canvas = document.createElement('canvas');
    if (!canvas || typeof canvas.getContext !== 'function') return false;
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    if (!gl) return false;
    if (typeof gl.getExtension === 'function') {
      const lose = gl.getExtension('WEBGL_lose_context');
      if (lose && typeof lose.loseContext === 'function') lose.loseContext();
    }
    return true;
  } catch (e) {
    return false;
  }
}

// 车头方向与「指向环心」方向的叉积符号：决定前轮往哪边打方向。
function steerSign(fwdX, fwdZ, toCX, toCZ) {
  return (fwdZ * toCX - fwdX * toCZ) >= 0 ? 1 : -1;
}

// 车轮自转角度增量（与行驶速度、轮径相关）
function wheelSpinDelta(speed, radius, dt) {
  return -(speed * DRIVE_R / radius) * dt;
}

/* ============================================================
 * 加载遮罩
 * ============================================================ */
const overlay = document.getElementById('overlay');
const ovText = document.getElementById('ovText');
const ovBar = document.getElementById('ovBar');
const ovHint = document.getElementById('ovHint');
const ovRetry = document.getElementById('ovRetry');
ovRetry.addEventListener('click', function () { location.reload(); });

function ovProgress(frac, text) {
  if (text) ovText.textContent = text;
  if (frac != null) ovBar.style.width = Math.round(frac * 100) + '%';
}
function ovFail(msg) {
  ovText.textContent = msg;
  ovHint.textContent = '离线模式：请双击项目里的 start.bat 启动本地服务；联网模式：直接双击 index.html（需联网）';
  ovRetry.hidden = false;
}

/* ============================================================
 * 引擎与模型加载
 * ============================================================ */
let THREE, OrbitControls, GLTFLoader, DRACOLoader, RoomEnvironment;

async function loadThree() {
  THREE = LOCAL ? await import('./vendor/three.module.js') : await import(CDN + 'build/three.module.js');
}

// 加载器/控制器只在确认 WebGL 可用后才加载：无 WebGL 的环境不再白下 4 个模块
async function loadAddons() {
  if (LOCAL) {
    OrbitControls = (await import('./vendor/OrbitControls.js')).OrbitControls;
    GLTFLoader = (await import('./vendor/GLTFLoader.js')).GLTFLoader;
    DRACOLoader = (await import('./vendor/DRACOLoader.js')).DRACOLoader;
    RoomEnvironment = (await import('./vendor/RoomEnvironment.js')).RoomEnvironment;
  } else {
    OrbitControls = (await import(CDN + 'examples/jsm/controls/OrbitControls.js')).OrbitControls;
    GLTFLoader = (await import(CDN + 'examples/jsm/loaders/GLTFLoader.js')).GLTFLoader;
    DRACOLoader = (await import(CDN + 'examples/jsm/loaders/DRACOLoader.js')).DRACOLoader;
    RoomEnvironment = (await import(CDN + 'examples/jsm/environments/RoomEnvironment.js')).RoomEnvironment;
  }
}

async function loadModel(onProgress) {
  const attempts = buildLoadAttempts(LOCAL);
  let loader = null, draco = null, decoderPath = null, lastErr = null;
  try {
    for (let i = 0; i < attempts.length; i++) {
      const a = attempts[i];
      if (a.decoder !== decoderPath) {
        // DRACOLoader 初始化失败后不会自愈，换解码器路径必须换一个新实例
        if (draco) draco.dispose();
        draco = new DRACOLoader();
        draco.setDecoderPath(a.decoder);
        loader = new GLTFLoader();
        loader.setDRACOLoader(draco);
        decoderPath = a.decoder;
      }
      try {
        return await loader.loadAsync(a.url, onProgress);
      } catch (e) {
        lastErr = e;
        console.warn('车辆模型加载失败：' + a.url + '（解码器 ' + a.decoder + '）', e);
      }
    }
    throw lastErr || new Error('车辆模型加载失败');
  } finally {
    // 解码已完成，worker 与 wasm 模块不再需要
    if (draco) draco.dispose();
  }
}

/* ============================================================
 * 主流程
 * ============================================================ */
(async function main() {
  try {
    await loadThree();

    // 测试/调试钩子（不影响渲染）：暴露纯逻辑与引擎版本，供 test/run.js 断言。
    window.__carDebug = {
      REVISION: THREE.REVISION,
      PAINTS: PAINTS, RIMS: RIMS, GLB_REMOTE: GLB_REMOTE,
      LOCAL_GLB: LOCAL_GLB, LOCAL_DRACO: LOCAL_DRACO, CDN_DRACO: CDN_DRACO,
      DRIVE_R: DRIVE_R, DRIVE_MAX_SPEED: DRIVE_MAX_SPEED, STEER_MAX: STEER_MAX,
      viewSize: viewSize, hasWebGL: hasWebGL, resolveMaterialKey: resolveMaterialKey,
      buildLoadAttempts: buildLoadAttempts, steerSign: steerSign, wheelSpinDelta: wheelSpinDelta
    };

    if (!hasWebGL()) {
      ovText.textContent = '⚠️ 无法创建 WebGL 上下文';
      ovHint.textContent = '请在浏览器设置中开启硬件加速（WebGL），或换用最新版 Chrome / Edge / Firefox 后重试。';
      ovRetry.hidden = false;
      return;
    }

    ovProgress(0.06, '正在加载加载器…');
    await loadAddons();

    ovProgress(0.08, '正在搭建场景…');
    const startSize = viewSize(innerWidth, innerHeight);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(startSize[0], startSize[1]);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xe8edf3, 45, 160);

    // 诊断钩子：控制台里 __carStats() 可查看显存对象数量与每帧绘制统计
    window.__carStats = function () {
      return {
        geometries: renderer.info.memory.geometries,
        textures: renderer.info.memory.textures,
        programs: renderer.info.programs ? renderer.info.programs.length : null,
        calls: renderer.info.render.calls,
        triangles: renderer.info.render.triangles
      };
    };

    const camera = new THREE.PerspectiveCamera(45, startSize[0] / startSize[1], 0.1, 300);
    camera.position.set(7.8, 3.4, 7.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.62, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3;
    controls.maxDistance = 40;
    controls.maxPolarAngle = Math.PI * 0.53;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;

    const domeUniforms = {
      top: { value: new THREE.Color(0x9fc3e8) },
      bottom: { value: new THREE.Color(0xeef3f8) }
    };
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(120, 32, 16),
      new THREE.ShaderMaterial({
        uniforms: domeUniforms,
        side: THREE.BackSide,
        depthWrite: false,
        vertexShader: [
          'varying vec3 vP;',
          'void main() {',
          '  vP = position;',
          '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
          '}'
        ].join('\n'),
        fragmentShader: [
          'uniform vec3 top;',
          'uniform vec3 bottom;',
          'varying vec3 vP;',
          'void main() {',
          '  float h = clamp(normalize(vP).y * 0.5 + 0.5, 0.0, 1.0);',
          '  gl_FragColor = vec4(mix(bottom, top, pow(h, 0.55)), 1.0);',
          '}'
        ].join('\n')
      })
    );
    scene.add(dome);

    // 环境反射：两张 PMREM 贴图烘焙完成后，PMREM 内部资源与临时场景即可释放
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envDayScene = new RoomEnvironment();
    const envNightScene = new RoomEnvironment();
    envNightScene.traverse(function (o) { if (o.isLight) o.intensity *= 0.22; });
    const envDay = pmrem.fromScene(envDayScene, 0.04).texture;
    const envNight = pmrem.fromScene(envNightScene, 0.04).texture;
    pmrem.dispose();
    envDayScene.dispose();
    envNightScene.dispose();
    scene.environment = envDay;

    const hemi = new THREE.HemisphereLight(0xffffff, 0x8d9aab, 0.55);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff2de, 2.6);
    sun.position.set(14, 22, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -16;
    sun.shadow.camera.right = 16;
    sun.shadow.camera.top = 16;
    sun.shadow.camera.bottom = -16;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 70;
    sun.shadow.bias = -0.0004;
    sun.shadow.camera.updateProjectionMatrix();
    scene.add(sun);
    scene.add(sun.target);

    const floorMat = new THREE.MeshStandardMaterial({ color: 0xe9edf2, roughness: 0.72, metalness: 0.06, envMapIntensity: 0.5 });
    const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 96), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const podiumMat = new THREE.MeshStandardMaterial({ color: 0x2c3138, metalness: 0.5, roughness: 0.35, envMapIntensity: 1.0 });
    const podium = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 0.06, 96), podiumMat);
    podium.position.y = 0.03;
    podium.receiveShadow = true;
    scene.add(podium);
    const podiumBase = new THREE.Mesh(new THREE.CylinderGeometry(3.62, 3.62, 0.03, 96), new THREE.MeshStandardMaterial({ color: 0x15181d, metalness: 0.4, roughness: 0.5 }));
    podiumBase.position.y = -0.015;
    scene.add(podiumBase);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x0a6b80 });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(3.28, 0.022, 8, 120), ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.065;
    scene.add(ring);

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x34383f, roughness: 0.92 });
    const road = new THREE.Mesh(new THREE.RingGeometry(7.4, 10.0, 128), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.02;
    road.receiveShadow = true;
    scene.add(road);
    // 40 条车道虚线共用一份几何体（原先每条各建一份）
    const dashMat = new THREE.MeshStandardMaterial({ color: 0xd5dbe2, roughness: 0.7 });
    const dashGeo = new THREE.BoxGeometry(0.14, 0.015, 0.9);
    for (let i = 0; i < 40; i++) {
      const a = (i / 40) * Math.PI * 2;
      const dash = new THREE.Mesh(dashGeo, dashMat);
      dash.position.set(Math.cos(a) * 8.7, 0.035, Math.sin(a) * 8.7);
      dash.rotation.y = -a + Math.PI / 2;
      dash.receiveShadow = true;
      scene.add(dash);
    }
    const curbMat = new THREE.MeshStandardMaterial({ color: 0xcfd6dd, roughness: 0.8 });
    function curbRing(rIn, rOut, y) {
      const c = new THREE.Mesh(new THREE.RingGeometry(rIn, rOut, 128), curbMat);
      c.rotation.x = -Math.PI / 2;
      c.position.y = y;
      c.receiveShadow = true;
      scene.add(c);
    }
    curbRing(7.32, 7.4, 0.03);
    curbRing(10.0, 10.08, 0.03);

    // 8 盏路灯：灯杆/灯臂/灯泡共用几何体与材质（原先每盏各建 3 份几何体 + 2 份相同材质）
    const lampMats = [];
    const lampSpots = [];
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: 0.6 });
    const poleGeo = new THREE.CylinderGeometry(0.05, 0.09, 4.4, 12);
    const armGeo = new THREE.BoxGeometry(1.1, 0.06, 0.06);
    const lampGeo = new THREE.SphereGeometry(0.16, 16, 12);
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2 + Math.PI / 8;
      const x = Math.cos(a) * 11.8, z = Math.sin(a) * 11.8;
      const pole = new THREE.Mesh(poleGeo, poleMat);
      pole.position.set(x, 2.2, z);
      pole.castShadow = true;
      scene.add(pole);
      const arm = new THREE.Mesh(armGeo, poleMat);
      arm.position.set(x - Math.cos(a) * 0.55, 4.35, z - Math.sin(a) * 0.55);
      arm.rotation.y = -a;
      arm.castShadow = true;
      scene.add(arm);
      const lampMat = new THREE.MeshStandardMaterial({ color: 0xfff2cf, emissive: 0xffe9b8, emissiveIntensity: 0.15, roughness: 0.4 });
      const lamp = new THREE.Mesh(lampGeo, lampMat);
      lamp.position.set(x - Math.cos(a) * 1.05, 4.3, z - Math.sin(a) * 1.05);
      scene.add(lamp);
      lampMats.push(lampMat);
      const spot = new THREE.SpotLight(0xfff0cc, 0, 45, 0.62, 0.5);
      spot.position.copy(lamp.position);
      const st = new THREE.Object3D();
      st.position.set(x * 0.72, 0, z * 0.72);
      scene.add(st);
      spot.target = st;
      scene.add(spot);
      lampSpots.push(spot);
    }

    const TREE_POS = [
      [0.24, 14.2], [0.72, 15.4], [1.25, 13.8], [1.72, 16.1], [2.25, 14.6],
      [2.73, 15.9], [3.2, 13.9], [3.75, 15.2], [4.2, 16.4], [4.72, 14.3],
      [5.18, 15.8], [5.7, 14.1], [6.16, 16.0]
    ];
    // 13 棵树共用树干/树冠几何体（原先每棵各建 4 份）
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5b4632, roughness: 0.9 });
    const leafMats = [0x2f7d46, 0x276a3c, 0x3d9257].map(function (c) {
      return new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, flatShading: true });
    });
    const trunkGeo = new THREE.CylinderGeometry(0.1, 0.16, 1.3, 8);
    const leafGeo = [
      new THREE.IcosahedronGeometry(0.95, 0),
      new THREE.IcosahedronGeometry(0.75, 0),
      new THREE.IcosahedronGeometry(0.65, 0)
    ];
    TREE_POS.forEach(function (p) {
      const a = p[0], r = p[1];
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 0.65;
      g.add(trunk);
      const s1 = new THREE.Mesh(leafGeo[0], leafMats[0]);
      s1.position.y = 1.7;
      const s2 = new THREE.Mesh(leafGeo[1], leafMats[1]);
      s2.position.set(0.25, 2.3, 0.1);
      const s3 = new THREE.Mesh(leafGeo[2], leafMats[2]);
      s3.position.set(-0.22, 2.25, -0.08);
      g.add(s1, s2, s3);
      g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      scene.add(g);
    });

    const paint = new THREE.MeshPhysicalMaterial({ color: 0xd40000, metalness: 0.85, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.35 });
    const accentBlue = new THREE.MeshPhysicalMaterial({ color: 0x1e90ff, metalness: 0.8, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.1 });
    const accentYellow = new THREE.MeshPhysicalMaterial({ color: 0xf7b400, metalness: 0.8, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.1 });
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xd9dee4, metalness: 1, roughness: 0.22, envMapIntensity: 1.1 });
    const tyreMat = new THREE.MeshStandardMaterial({ color: 0x0d0e10, roughness: 0.92, metalness: 0 });
    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x0c141b, metalness: 0, roughness: 0.04, transmission: 1, thickness: 0.02, ior: 1.45, transparent: true, envMapIntensity: 1.3 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xe6ebf1, metalness: 1, roughness: 0.12, envMapIntensity: 1.2 });
    const metalGrayMat = new THREE.MeshStandardMaterial({ color: 0x8a929c, metalness: 1, roughness: 0.35, envMapIntensity: 0.9 });
    const darkPlasticMat = new THREE.MeshStandardMaterial({ color: 0x1a1c20, roughness: 0.55, metalness: 0.3, envMapIntensity: 0.6 });
    const plasticGrayMat = new THREE.MeshStandardMaterial({ color: 0x30343a, roughness: 0.6, metalness: 0.3, envMapIntensity: 0.6 });
    const grillMat = new THREE.MeshStandardMaterial({ color: 0x0a0b0d, roughness: 0.9, metalness: 0.1 });
    const carbonMat = new THREE.MeshStandardMaterial({ color: 0x1c1e22, metalness: 0.65, roughness: 0.32, envMapIntensity: 0.9 });
    const leatherMat = new THREE.MeshStandardMaterial({ color: 0x2b2320, roughness: 0.85, metalness: 0 });
    const leatherRedMat = new THREE.MeshStandardMaterial({ color: 0x7c1d1d, roughness: 0.8, metalness: 0 });
    const interiorDarkMat = new THREE.MeshStandardMaterial({ color: 0x101114, roughness: 0.7, metalness: 0.2 });
    const carpetMat = new THREE.MeshStandardMaterial({ color: 0x24211d, roughness: 1, metalness: 0 });
    const caliperMat = new THREE.MeshStandardMaterial({ color: 0xf2b705, metalness: 0.5, roughness: 0.35, envMapIntensity: 0.8 });
    const discMat = new THREE.MeshStandardMaterial({ color: 0xb9bfc6, metalness: 1, roughness: 0.4, envMapIntensity: 0.7 });
    const headlightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.35, roughness: 0.3 });
    const taillightMat = new THREE.MeshStandardMaterial({ color: 0x8f0b0b, emissive: 0xff2020, emissiveIntensity: 1.4, roughness: 0.35 });
    const turnMat = new THREE.MeshStandardMaterial({ color: 0x8f5b0b, emissive: 0xffa520, emissiveIntensity: 0.9, roughness: 0.35 });
    const interiorLightMat = new THREE.MeshStandardMaterial({ color: 0x332a1a, emissive: 0xffd9a0, emissiveIntensity: 0.4, roughness: 0.5 });
    const projectorGlassMat = new THREE.MeshPhysicalMaterial({ color: 0xcfd6dd, metalness: 0.1, roughness: 0.1, transmission: 0.4, transparent: true });

    // 材质键 → 材质实例（键来自 resolveMaterialKey）
    const MAT_KEYS = {
      paint: paint, accentBlue: accentBlue, accentYellow: accentYellow, glass: glassMat,
      caliper: caliperMat, grill: grillMat, darkPlastic: darkPlasticMat,
      headlight: headlightMat, taillight: taillightMat, interiorLight: interiorLightMat,
      rim: rimMat, tyre: tyreMat, disc: discMat, carbon: carbonMat, chrome: chromeMat,
      metalGray: metalGrayMat, plasticGray: plasticGrayMat, leather: leatherMat,
      leatherRed: leatherRedMat, interiorDark: interiorDarkMat, carpet: carpetMat,
      projectorGlass: projectorGlassMat, turn: turnMat
    };

    const carGroup = new THREE.Group();
    scene.add(carGroup);
    const wheelSpin = [];
    const frontPivots = [];
    let wheelRadius = 0.358, carLen = 4.53, carH = 1.24, carCenterY = 0.62;

    function makeSpot(x, y, z, tx) {
      const spot = new THREE.SpotLight(0xfff2cf, 0, 70, 0.6, 0.5);
      spot.position.set(x, y, z);
      carGroup.add(spot);
      const t = new THREE.Object3D();
      t.position.set(tx, 0.15, z - 22);
      carGroup.add(t);
      spot.target = t;
      return spot;
    }
    let headL = null, headR = null;

    function setupCar(gltf) {
      const s = gltf.scene;
      carGroup.add(s);

      const box = new THREE.Box3().setFromObject(s);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      carLen = size.z;
      carH = size.y;
      carCenterY = size.y / 2;
      carGroup.position.set(-center.x, -box.min.y, -center.z);

      const originalMats = new Set();
      let partCount = 0;
      s.traverse(function (o) {
        if (!o.isMesh) return;
        partCount++;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (let i = 0; i < mats.length; i++) if (mats[i]) originalMats.add(mats[i]);
        const first = mats[0];
        const key = resolveMaterialKey(o.name, first && first.name);
        const target = key ? MAT_KEYS[key] : null;
        if (target) o.material = target;
        o.castShadow = o.name !== 'glass';
      });

      // 释放被替换掉、已无人引用的 GLB 自带材质
      const usedMats = new Set();
      s.traverse(function (o) {
        if (!o.isMesh) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (let i = 0; i < mats.length; i++) if (mats[i]) usedMats.add(mats[i]);
      });
      originalMats.forEach(function (m) { if (!usedMats.has(m)) m.dispose(); });

      const tire0 = s.getObjectByName('tire');
      if (tire0) {
        const tb = new THREE.Box3().setFromObject(tire0);
        wheelRadius = tb.getSize(new THREE.Vector3()).y / 2;
      }

      s.traverse(function (o) {
        const m = /^wheel_(fl|fr|rl|rr)$/.exec(o.name);
        if (!m) return;
        const pivot = new THREE.Group();
        pivot.position.copy(o.position);
        o.parent.add(pivot);
        pivot.attach(o);
        wheelSpin.push(o);
        if (m[1] === 'fl' || m[1] === 'fr') frontPivots.push(pivot);
      });

      headL = makeSpot(0.6, carH * 0.5, -carLen / 2 + 0.15, 0.5);
      headR = makeSpot(-0.6, carH * 0.5, -carLen / 2 + 0.15, -0.5);

      window.__car = {
        mode: LOCAL ? 'local' : 'cdn',
        revision: THREE.REVISION,
        loaded: true,
        parts: partCount,
        length: +carLen.toFixed(2),
        height: +carH.toFixed(2),
        wheelRadius: +wheelRadius.toFixed(3),
        wheels: wheelSpin.length
      };
    }

    ovProgress(0.12, '正在下载车辆模型…');
    const gltf = await loadModel(function (e) {
      if (e.total) {
        ovProgress(0.12 + 0.8 * (e.loaded / e.total), '正在下载车辆模型 ' + Math.round(e.loaded / e.total * 100) + '%');
      }
    });
    ovProgress(0.95, '正在装配车辆…');
    setupCar(gltf);
    ovProgress(1, '准备就绪');

    const paintBox = document.getElementById('paintSw');
    PAINTS.forEach(function (p) {
      const el = document.createElement('div');
      el.className = 'sw';
      el.title = p[0];
      el.style.background = p[1];
      el.addEventListener('click', function () {
        paint.color.set(p[1]);
        paintBox.querySelectorAll('.sw').forEach(function (s2) { s2.classList.remove('active'); });
        el.classList.add('active');
      });
      paintBox.appendChild(el);
      if (p[1] === PAINTS[0][1]) el.classList.add('active');
    });

    const rimBox = document.getElementById('rimSw');
    RIMS.forEach(function (p) {
      const el = document.createElement('div');
      el.className = 'sw';
      el.title = p[0];
      el.style.background = p[1];
      el.addEventListener('click', function () {
        rimMat.color.set(p[1]);
        rimBox.querySelectorAll('.sw').forEach(function (s2) { s2.classList.remove('active'); });
        el.classList.add('active');
      });
      rimBox.appendChild(el);
      if (p[1] === RIMS[0][1]) el.classList.add('active');
    });

    const driveBtn = document.getElementById('drive');
    const rotateBtn = document.getElementById('rotate');
    const nightBtn = document.getElementById('night');
    const resetBtn = document.getElementById('reset');

    let driving = false;
    let follow = false;
    let driveSpeed = 0;
    let driveAngle = 0;
    let rotateActive = true;

    driveBtn.addEventListener('click', function () {
      driving = !driving;
      driveBtn.textContent = driving ? '🛑 停车' : '▶ 行驶';
      driveBtn.classList.toggle('active', driving);
      if (driving) {
        follow = true;
        rotateActive = controls.autoRotate;
        controls.autoRotate = false;
        controls.enabled = false;
      } else {
        follow = false;
        controls.enabled = true;
        controls.autoRotate = rotateActive;
      }
    });
    rotateBtn.addEventListener('click', function () {
      controls.autoRotate = !controls.autoRotate;
      rotateBtn.classList.toggle('active', controls.autoRotate);
    });
    resetBtn.addEventListener('click', function () {
      if (!driving) flyView(7.6, 3.3, 7.6);
    });

    let night = false;
    nightBtn.addEventListener('click', function () {
      night = !night;
      nightBtn.classList.toggle('active', night);
      domeUniforms.top.value.set(night ? 0x070b16 : 0x9fc3e8);
      domeUniforms.bottom.value.set(night ? 0x141b2e : 0xeef3f8);
      scene.fog.color.set(night ? 0x0a0f1a : 0xe8edf3);
      scene.environment = night ? envNight : envDay;
      hemi.intensity = night ? 0.14 : 0.55;
      sun.intensity = night ? 0.5 : 2.6;
      headL.intensity = headR.intensity = night ? 260 : 0;
      headlightMat.emissiveIntensity = night ? 4.5 : 0.35;
      taillightMat.emissiveIntensity = night ? 5 : 1.4;
      turnMat.emissiveIntensity = night ? 2.6 : 0.9;
      interiorLightMat.emissiveIntensity = night ? 1.6 : 0.4;
      ringMat.color.set(night ? 0x3ae8ff : 0x0a6b80);
      floorMat.color.set(night ? 0x0f131a : 0xe9edf2);
      podiumMat.color.set(night ? 0x15181e : 0x2c3138);
      roadMat.color.set(night ? 0x171b21 : 0x34383f);
      dashMat.color.set(night ? 0x39404d : 0xd5dbe2);
      curbMat.color.set(night ? 0x232834 : 0xcfd6dd);
      lampMats.forEach(function (m) { m.emissiveIntensity = night ? 3.4 : 0.15; });
      lampSpots.forEach(function (s) { s.intensity = night ? 55 : 0; });
    });

    let camAnim = null;
    function flyTo(pos, tgt) {
      camAnim = {
        fromP: camera.position.clone(), toP: pos.clone(),
        fromT: controls.target.clone(), toT: tgt.clone(), t: 0
      };
    }
    function flyView(x, y, z) {
      const center = new THREE.Vector3(0, carCenterY, 0).applyMatrix4(carGroup.matrixWorld);
      const off = new THREE.Vector3(x, y, z).applyQuaternion(carGroup.quaternion);
      flyTo(center.clone().add(off), center);
    }
    document.getElementById('v1').addEventListener('click', function () { if (!driving) flyView(-4.6, 2.2, -4.6); });
    document.getElementById('v2').addEventListener('click', function () { if (!driving) flyView(6.4, 1.8, 0.4); });
    document.getElementById('v3').addEventListener('click', function () { if (!driving) flyView(4.6, 2.1, 4.6); });
    document.getElementById('v4').addEventListener('click', function () { if (!driving) flyView(7.6, 3.3, 7.6); });

    // 每帧复用的临时向量，避免渲染循环里反复 new
    const FWD_LOCAL = new THREE.Vector3(0, 0, -1);
    const _tangent = new THREE.Vector3();
    const _fwd = new THREE.Vector3();
    const _toCenter = new THREE.Vector3();
    const _behind = new THREE.Vector3();
    const _look = new THREE.Vector3();

    function updateDrive(dt) {
      if (driving) {
        driveSpeed += (DRIVE_MAX_SPEED - driveSpeed) * Math.min(1, dt * 1.3);
      } else {
        driveSpeed = Math.max(0, driveSpeed - dt * 1.1);
      }
      if (driveSpeed > 0.001) {
        driveAngle += driveSpeed * dt;
        carGroup.position.set(Math.sin(driveAngle) * DRIVE_R, 0, Math.cos(driveAngle) * DRIVE_R);
        _tangent.set(Math.cos(driveAngle), 0, -Math.sin(driveAngle));
        carGroup.quaternion.setFromUnitVectors(FWD_LOCAL, _tangent);
        const spinD = wheelSpinDelta(driveSpeed, wheelRadius, dt);
        for (const w of wheelSpin) w.rotation.x += spinD;
        _fwd.copy(FWD_LOCAL).applyQuaternion(carGroup.quaternion);
        _toCenter.copy(carGroup.position).multiplyScalar(-1);
        _toCenter.y = 0;
        _toCenter.normalize();
        const steerTarget = STEER_MAX * steerSign(_fwd.x, _fwd.z, _toCenter.x, _toCenter.z) *
          Math.min(1, driveSpeed / DRIVE_MAX_SPEED);
        for (const p of frontPivots) {
          p.rotation.y += (steerTarget - p.rotation.y) * Math.min(1, dt * 6);
        }
      }
    }

    const clock = new THREE.Clock();
    let firstFrame = true;
    renderer.setAnimationLoop(function () {
      const dt = Math.min(clock.getDelta(), 0.05);
      updateDrive(dt);
      if (follow) {
        _behind.set(0, 2.6, 7.0);
        carGroup.localToWorld(_behind).sub(carGroup.position);
        camera.position.lerp(_behind, 1 - Math.exp(-3.5 * dt));
        _look.copy(carGroup.position);
        _look.y += 0.6;
        controls.target.lerp(_look, 1 - Math.exp(-4 * dt));
        camera.lookAt(controls.target);
      } else if (camAnim && camAnim.t < 1) {
        camAnim.t = Math.min(1, camAnim.t + dt / 0.9);
        const e = 1 - Math.pow(1 - camAnim.t, 3);
        camera.position.lerpVectors(camAnim.fromP, camAnim.toP, e);
        controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
        controls.enabled = false;
        if (camAnim.t >= 1) { camAnim = null; controls.enabled = true; }
      }
      controls.update();
      renderer.render(scene, camera);
      if (firstFrame) {
        firstFrame = false;
        overlay.style.display = 'none';
      }
    });

    addEventListener('resize', function () {
      const s = viewSize(innerWidth, innerHeight);
      camera.aspect = s[0] / s[1];
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.setSize(s[0], s[1]);
    });
  } catch (err) {
    console.error(err);
    ovFail('⚠️ 加载失败：' + (err && err.message ? err.message : String(err)));
  }
})();
</script>
</body>
</html>
