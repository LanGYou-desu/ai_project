<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电路沙盒</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <button id="btn-play" class="primary">▶ 播放</button>
      <button id="btn-step">⏭ 单步</button>
      <button id="btn-settle">⚙ settle</button>
      <select id="sel-speed">
        <option value="1">1x</option>
        <option value="4">4x</option>
        <option value="16">16x</option>
      </select>
      <button id="btn-clear">清空</button>
      <button id="btn-save">保存</button>
      <button id="btn-load">载入</button>
      <label><input type="checkbox" id="chk-voltages"> 显示电压</label>
      <label><input type="checkbox" id="chk-grid"> 网格</label>
      <select id="sel-level">
        <option value="">关卡选择</option>
        <option value="1">1 点亮第一盏灯</option>
        <option value="2">2 分压器</option>
        <option value="3">3 二极管整流</option>
        <option value="4">4 RC 充电</option>
        <option value="5">5 二极管 NOT 门</option>
        <option value="6">6 二极管 AND 门</option>
        <option value="7">7 三极管开关</option>
        <option value="8">8 同相放大器</option>
        <option value="9">9 RC 振荡器</option>
      </select>
      <span id="level-result" class="status"></span>
      <span id="status" class="status"></span>
    </header>
    <main>
      <aside id="palette"></aside>
      <section id="canvas-wrap">
        <canvas id="canvas"></canvas>
      </section>
      <aside id="instruments">
        <div class="inst"><div class="inst-title">示波器</div><canvas id="oscilloscope"></canvas></div>
        <div class="inst"><div class="inst-title">万用表</div><canvas id="multimeter"></canvas></div>
        <div class="inst">
          <div class="inst-title">探针</div>
          <div style="padding:6px;font-size:12px;">
            <label><input type="radio" name="probe" value="A"> A</label>
            <label><input type="radio" name="probe" value="B"> B</label>
            <label><input type="radio" name="probe" value="" checked> 无</label>
            <div style="margin-top:4px;color:#9aa0a6;">点击节点设置探针</div>
          </div>
        </div>
      </aside>
    </main>
    <div id="param-panel"></div>
    <div id="toast" class="toast"></div>
  </div>
  <script src="js/circuit.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/instruments.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const app = new window.App({
        canvas: document.getElementById('canvas'),
        oscopeCanvas: document.getElementById('oscilloscope'),
        meterCanvas: document.getElementById('multimeter')
      });
      window.app = app;
    });
  </script>
</body>
</html>
